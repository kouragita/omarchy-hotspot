# DHCP + DNS for the hotspot clients. Runs as its own instance on ap0 only,
# so it never touches systemd-resolved or the Pycelink uplink.
interface=ap0
bind-dynamic
except-interface=lo
dhcp-range=10.42.0.10,10.42.0.200,255.255.255.0,12h
dhcp-option=3,10.42.0.1
dhcp-option=6,10.42.0.1
# Uplink path MTU is 1492 (see nat.nft MSS clamp); clients must not assume 1500.
dhcp-option=26,1492
server=8.8.8.8
server=8.8.4.4
domain-needed
bogus-priv
no-resolv
log-dhcp

