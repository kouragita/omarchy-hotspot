# Concurrent AP on a second vif of the Intel 7265 phy.
# channel / ht_capab are REWRITTEN by apply.sh to mirror the live uplink,
# because iwlwifi enforces #channels <= 1 and the channel context must match.
interface=ap0
driver=nl80211
ssid=omarchy-share
hw_mode=g
channel=2
ieee80211n=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
ieee80211d=1
country_code=KE
wmm_enabled=1
auth_algs=1
wpa=2
wpa_passphrase=mcHLtcbEJajoMVzc
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
macaddr_acl=0

# Station-to-station traffic is blocked: on a shared hotspot one guest must
# not be able to probe another's device. Clients still reach the gateway.
ap_isolate=1
